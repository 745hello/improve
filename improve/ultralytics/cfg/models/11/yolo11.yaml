  - [-1, 1, FDSG, [352, 4]]                         # 21

  - [-1, 1, Conv, [704, 3, 2]]                      # 22
  - [[-1, 10, 10], 1, DCAF, [704]]                  # 23
  - [-1, 1, FDSG, [704, 5]]                         # 24

  - [[18, 21, 24], 1, DetectGLR, [nc]]              # 25
